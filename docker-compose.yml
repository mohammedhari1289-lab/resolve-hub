services:
  db:
    image: postgres:16-alpine
    container_name: resolvehub-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: resolvehub
    ports:
      - "5432:5432"
    volumes:
      - resolvehub-data:/var/lib/postgresql/data
volumes:
  resolvehub-data:
